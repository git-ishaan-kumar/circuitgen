# BUILD SYSTEM

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# PROJECT CONFIGURATION

[project]
name = "circuitgen"
version = "0.2.0"
description = "A Python library and CLI for generating circuit schematics from text descriptions or netlists."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Ishaan"}
]
keywords = [
    "circuit",
    "schematic",
    "electronics",
    "circuit-diagram",
    "netlist",
    "svg",
    "circuit-generator",
    "python-library",
    "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=8.2.8",
    "rich>=13.0.0",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
    "resvg-py>=0.5.0,<0.6",
    "Pillow>=11.3",
]

[project.scripts]
circuit = "circuitgen.cli:main"

[project.urls]
Homepage = "https://github.com/git-ishaan-kumar/circuitgen"

# PACKAGE DISCOVERY

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"circuitgen.tui" = ["*.tcss"]

